<H1>$trim</H1>
<br>
<br>
The <b>$trim</b> identifier that removes excess space for the left, middle or right of text.

<H4>Synopsis</H4>
<pre class = "code">
$trim(text,lmr)
</pre>

<H4>Parameters</H4>
<b>l</b> - left
<br><b>m</b> - middle
<br><b>r</b> - right

<H4>Properties</H4>
None
